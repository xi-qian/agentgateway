[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-distributed"
version = "0.1.0"
description = "Distributed gateway and agent service for Hermes Agent"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.0",
]

[project.entry-points."hermes_agent.plugins"]
hermes-distributed = "agent.plugin"

[project.scripts]
hermes-gateway = "gateway.server:main"
hermes-agent-service = "agent.agent_service:main"
hermes-manager = "manager.server:main"
hermes-daemon = "agent.daemon:main"
